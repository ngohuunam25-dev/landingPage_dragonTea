<section class="" id="gallery">
  <div class="">
    <div class="gallery__grid grid grid--4" data-reveal>
      <!-- Ảnh 1: Lội suối với ủng xanh -->
      <div class="gallery__item">
        <img
          data-img="group.one"
          alt="Trải nghiệm lội suối vùng trà"
          loading="lazy"
        />
      </div>

      <!-- Ảnh 2: Người vác balo băng rừng -->
      <div class="gallery__item">
        <img
          data-img="group.two"
          alt="Băng rừng khảo sát vùng chè cổ thụ"
          loading="lazy"
        />
      </div>

      <!-- Ảnh 3: Dắt tay nhau qua ghềnh đá -->
      <div class="gallery__item">
        <img
          data-img="group.three"
          alt="Đoàn khảo sát vượt suối đá"
          loading="lazy"
        />
      </div>

      <!-- Ảnh 4: Ekip quay phim/chụp ảnh giữa thiên nhiên -->
      <div class="gallery__item">
        <img
          data-img="group.four"
          alt="Ekip làm việc tại rừng nguyên sinh"
          loading="lazy"
        />
      </div>
    </div>
  </div>
